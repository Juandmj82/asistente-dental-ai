<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente cerámico sutil estilo Apple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D1D1F"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Gradiente de acento azul clínico -->
    <linearGradient id="blueSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997FF"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>
  </defs>

  <!-- Squircle contenedor oscuro premium (radio continuo Apple) -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Silueta geométrica minimalista: Corona dental estilizada + inicial 'S' / precisión -->
  <g transform="translate(24, 23)">
    <!-- Corona dental monolítica continua -->
    <path d="M7 16 C7 9, 13 4, 21 4 C25 4, 26 7, 26 9 C26 7, 27 4, 31 4 C39 4, 45 9, 45 16 C45 25, 41 33, 38 41 C36 46, 33 50, 29 50 C26 50, 25 44, 26 38 C26 35, 26 35, 26 35 C26 35, 26 35, 26 38 C27 44, 26 50, 23 50 C19 50, 16 46, 14 41 C11 33, 7 25, 7 16 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.95"/>

    <!-- Arco de luz superior / destello de esmalte y salud -->
    <path d="M14 14 C16 9, 20 7, 24 7" 
          stroke="url(#blueSpark)" 
          stroke-width="3" 
          stroke-linecap="round"/>

    <!-- Punto de precisión médica en zafiro -->
    <circle cx="26" cy="22" r="3" fill="url(#blueSpark)"/>
  </g>
</svg>
